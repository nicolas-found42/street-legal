[workspace]
resolver = "2"
members = [
    "crates/slr-audio",
    "crates/slr-boot",
    "crates/slr-calllog",
    "crates/slr-core",
    "crates/slr-d3d9",
    "crates/slr-fmt-cfg",
    "crates/slr-fmt-core",
    "crates/slr-fmt-ground",
    "crates/slr-fmt-rpak",
    "crates/slr-fmt-scx",
    "crates/slr-fmt-skeleton",
    "crates/slr-fmt-sdat",
    "crates/slr-fmt-sound",
    "crates/slr-fmt-traffic",
    "crates/slr-fmt-video",
    "crates/slr-fmt-pedestrian",
    "crates/slr-fmt-spline",
    "crates/slr-fmt-texture",
    "crates/slr-formats",
    "crates/slr-game",
    "crates/slr-input",
    "crates/slr-io",
    "crates/slr-lang",
    "crates/slr-ledger",
    "crates/slr-physics",
    "crates/slr-platform",
    "crates/slr-render-natives",
    "crates/slr-resource",
    "crates/slr-sound",
    "crates/slr-vm",
    "crates/slr-world",
    "crates/slr-x87",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[profile.dev]
opt-level = 1

[profile.release]
debug = false

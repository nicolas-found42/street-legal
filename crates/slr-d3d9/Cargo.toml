[package]
name = "slr-d3d9"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wgpu = { version = "25.0.2", default-features = false, features = ["metal", "wgsl"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
slr-calllog = { path = "../slr-calllog" }
slr-telemetry = { path = "../slr-telemetry" }
thiserror = "2"

[[bin]]
name = "slr-d3d9-stream"
path = "src/bin/slr-d3d9-stream.rs"
